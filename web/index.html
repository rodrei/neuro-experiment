<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio 1 — Conversaciones</title>
  <link rel="stylesheet" href="/static/vendor/jspsych.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- The demo assumes a keyboard and a wide screen: the chat and the PANAS
     grids do not fit comfortably on a phone. -->
<div id="mobile-notice">
  <p><strong>Abrí esta página en una computadora.</strong></p>
  <p>El estudio necesita teclado y una pantalla ancha.</p>
</div>

<div id="start">
  <h1>Estudio 1 — Conversaciones</h1>
  <p class="subtitle">
    Demo para el grupo. No es una corrida con participantes reales.
  </p>

  <form id="form">
    <label>
      ID de participante
      <input name="participant_id" type="text" value="demo" required>
    </label>

    <label>
      Edad
      <input name="age" type="number" min="18" max="99" value="25">
    </label>

    <label>
      Sexo
      <select name="sex">
        <option>mujer</option>
        <option>varón</option>
        <option>otro / prefiero no decir</option>
      </select>
    </label>

    <label>
      Condición (entre-sujetos)
      <select name="agent_condition">
        <option value="human">humano — otra persona</option>
        <option value="ai">ia — asistente conversacional</option>
      </select>
    </label>

    <label>
      Orden (contrabalanceo)
      <select name="order">
        <option value="1">1 — validación primero</option>
        <option value="2">2 — rechazo primero</option>
      </select>
    </label>

    <label>
      Agente
      <select name="agent">
        <option value="scripted">guionado — mensajes fijos</option>
        <option value="llm">llm — generados por un modelo</option>
      </select>
    </label>

    <label>
      Código de acceso
      <input name="access_code" type="password" placeholder="dejar vacío si no hay">
    </label>

    <label class="check-row">
      <input name="test_mode" type="checkbox" value="1">
      Modo test: botón <strong>Saltar</strong> y tecla <strong>F9</strong> en
      cada pantalla. Lo salteado queda vacío en los CSV.
    </label>

    <button type="submit" id="begin">Empezar</button>
    <p id="load-status">Cargando el protocolo…</p>
  </form>
</div>

<div id="jspsych-target"></div>

<!-- Outside #jspsych-target on purpose: jsPsych empties that container on
     every trial. Only shown in test mode. Bottom right, like SKIP_POS on the
     desktop: nothing is there on any screen. -->
<button id="skip" type="button" hidden>Saltar (F9)</button>

<script src="/static/vendor/jspsych.js"></script>
<script src="/static/vendor/plugin-html-button-response.js"></script>
<script src="/static/vendor/plugin-html-keyboard-response.js"></script>
<script src="/static/vendor/plugin-html-slider-response.js"></script>
<script src="/static/vendor/plugin-survey-likert.js"></script>
<script src="/static/vendor/plugin-survey-text.js"></script>
<script src="/js/protocol.js"></script>
<script src="/js/chat-plugin.js"></script>
<script src="/js/scales.js"></script>
<script src="/js/experiment.js"></script>

</body>
</html>
