<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio 1 — Conversaciones</title>
  <link rel="stylesheet" href="/static/vendor/jspsych.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- The study assumes a keyboard and a wide screen: the chat and the slider
     scales do not fit comfortably on a phone. -->
<div id="mobile-notice">
  <p><strong>Abrí esta página en una computadora.</strong></p>
  <p>El estudio necesita teclado y una pantalla ancha.</p>
</div>

<!-- Only in demo mode: stays on every screen. -->
<div id="demo-badge" hidden></div>

<div id="start">
  <h1>Estudio 1 — Conversaciones</h1>
  <p class="subtitle">
    Cuatro conversaciones sobre situaciones personales.
  </p>
  <p id="demo-note" hidden></p>

  <form id="form">
    <label class="research-only">
      ID de participante
      <input name="participant_id" type="text" value="demo" required>
    </label>

    <label class="research-only">
      Edad
      <input name="age" type="number" min="18" max="99" value="25">
    </label>

    <label class="research-only">
      Sexo
      <select name="sex">
        <option>mujer</option>
        <option>varón</option>
        <option>otro / prefiero no decir</option>
      </select>
    </label>

    <label class="research-only">
      Secuencia de condiciones (se sugiere a partir del ID)
      <select name="sequence" id="sequence"></select>
    </label>

    <label class="research-only">
      Secuencia de dominios (se sugiere a partir del ID)
      <select name="domain_sequence" id="domain_sequence"></select>
    </label>

    <label>
      Código de acceso
      <input name="access_code" type="password">
    </label>

    <label class="check-row research-only">
      <input name="test_mode" type="checkbox" value="1">
      <span>Modo test: botón <strong>Saltar</strong> y tecla <strong>F9</strong>
      en cada pantalla, y aviso en pantalla cuando un turno del LLM cae al
      fallback. Lo salteado queda vacío en los CSV.</span>
    </label>

    <button type="submit" id="begin">Empezar</button>
    <p id="load-status">Cargando el protocolo…</p>
    <div class="research-only">
      <p id="llm-health" class="health pending">Comprobando el LLM…</p>
      <p class="health-actions">
        <a href="#" id="llm-retry">Volver a comprobar el LLM</a>
      </p>
    </div>
  </form>
</div>

<!-- Opens when the access code is wrong or blank. Its text comes from
     protocol/texts.json. -->
<dialog id="code-dialog">
  <h2 id="code-title"></h2>
  <p id="code-message"></p>
  <p id="code-question"></p>
  <div class="dialog-actions">
    <button type="button" id="code-retry"></button>
    <button type="button" id="code-fixed" class="secondary"></button>
  </div>
</dialog>

<div id="jspsych-target"></div>

<!-- Outside #jspsych-target on purpose: jsPsych empties that container on
     every trial. Only shown in test mode and in the demo. Bottom right:
     nothing is there on any screen. -->
<button id="skip" type="button" hidden>Saltar (F9)</button>

<script src="/static/vendor/jspsych.js"></script>
<script src="/static/vendor/plugin-html-button-response.js"></script>
<script src="/static/vendor/plugin-html-keyboard-response.js"></script>
<script src="/static/vendor/plugin-html-slider-response.js"></script>
<script src="/static/vendor/plugin-survey-text.js"></script>
<script src="/js/protocol.js"></script>
<script src="/js/chat-plugin.js"></script>
<script src="/js/scales.js"></script>
<script src="/js/experiment.js"></script>

</body>
</html>
