# Deployment of the Study 1 web demo.
#
# The account is on the legacy Hobby plan, which keeps the old free
# allowance (3 shared-cpu-1x VMs of 256 MB, 3 GB of volume, 100 GB of
# traffic). The values here are chosen to fit that allowance: do NOT raise
# the memory or the volume size without knowing that starts billing.

app = "neuro-estudio1-demo"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# The sessions' CSVs. The volume is tied to this machine: download them with
# `fly sftp get` after every demo, do not treat it as durable storage. The
# volume keeps its original name on fly ("datos"); only the mount path is
# English.
[[mounts]]
  source = "datos"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
